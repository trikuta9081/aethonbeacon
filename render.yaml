services:
  - type: web
    name: aethon-beacon-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: EXPO_PUBLIC_VERIFICATION_API_BASE_URL
        value: https://aethon-beacon-verification.onrender.com
      - key: TESTER_REQUEST_NOTIFY_EMAIL
        value: slathiarimple567@gmail.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: Aethon Beacon
      - key: GOOGLE_TESTER_GROUP_EMAIL
        sync: false
      - key: GOOGLE_GROUP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_WORKSPACE_SUBJECT
        sync: false
      - key: APPSTORE_API_KEY_ID
        sync: false
      - key: APPSTORE_API_ISSUER_ID
        sync: false
      - key: APPSTORE_API_KEY_P8
        sync: false
      - key: APPSTORE_BETA_GROUP_ID
        sync: false
      - key: TESTER_SYNC_TOKEN
        sync: false
      - key: TESTER_SYNCED_LOG_PATH
        value: /tmp/aethon-tester-synced.ndjson

  - type: web
    name: aethon-beacon-verification
    runtime: docker
    dockerfilePath: ./Dockerfile.verification
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8787"
      - key: VERIFICATION_HOST
        value: "0.0.0.0"
      - key: VERIFICATION_CORS_ORIGIN
        value: https://aethonbeacon.com,https://aethon-beacon-web.onrender.com
      - key: VERIFICATION_BRAND_NAME
        value: Aethon Beacon
      - key: LOCAL_VERIFICATION_DEBUG
        value: "0"
      - key: VERIFICATION_SMS_WEBHOOK_URL
        sync: false
      - key: VERIFICATION_EMAIL_WEBHOOK_URL
        sync: false
      - key: VERIFICATION_CODE_TTL_MS
        value: "600000"
      - key: VERIFICATION_MAX_REQUESTS_PER_WINDOW
        value: "5"
      - key: VERIFICATION_REQUEST_WINDOW_MS
        value: "900000"
      - key: VERIFICATION_MAX_CONFIRM_ATTEMPTS
        value: "5"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: Aethon Beacon
      - key: GUIDANCE_SERVICE_KEY
        sync: false
      - key: GUIDANCE_MODEL
        sync: false
      - key: ADMIN_LOGIN_ID
        sync: false
      - key: ADMIN_LOGIN_CODE
        sync: false
      - key: ADMIN_SESSION_TTL_MS
        value: "28800000"
      - key: ADMIN_LOCKOUT_TTL_MS
        value: "300000"
      - key: ADMIN_MAX_FAILED_ATTEMPTS
        value: "5"
      # ── RevenueCat entitlement webhook (see supabase_entitlements_schema.sql,
      # entitlements.ts, and ENTITLEMENT_SETUP_CHECKLIST.md) ──
      - key: SUPABASE_URL
        sync: false
        # Same project as EXPO_PUBLIC_SUPABASE_URL on the web service above --
        # not secret, just kept unprefixed since this process is never bundled
        # into the app.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        # Settings -> API -> service_role key in the Supabase dashboard.
        # NEVER give this the EXPO_PUBLIC_ prefix or put it in the app -- it
        # bypasses Row Level Security, which is exactly why only this backend
        # process is allowed to write premium status.
      - key: REVENUECAT_WEBHOOK_AUTH_HEADER
        sync: false
        # Set the same value in RevenueCat's dashboard: Project -> Integrations
        # -> Webhooks -> your integration -> Authorization header.
      - key: REVENUECAT_WEBHOOK_SIGNING_SECRET
        sync: false
        # Optional but recommended: RevenueCat dashboard -> your webhook
        # integration -> toggle "HMAC webhook signing" -> copy the secret here.
        # Shown only once at creation/rotation.
