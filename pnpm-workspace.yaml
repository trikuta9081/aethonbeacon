# pnpm 9 requires a `packages` field. Root itself is the package (single-package repo).
packages:
  - .

minimumReleaseAgeExclude:
  - expo-updates@56.0.21
  - uuid@11.1.1
  - brace-expansion@5.0.7 || 5.0.8
  - js-yaml@4.3.0
  - shell-quote@1.8.5
  - postcss@8.5.18

overrides:
  uuid@<11.1.1: ^11.1.1
  "@xmldom/xmldom": ">=0.9.12"
  baseline-browser-mapping: ">=2.11.0"
  brace-expansion: ">=5.0.9"
  browserslist: ">=4.28.7"
  image-size: ">=2.0.3"
  js-yaml: ">=4.3.2"
  nanoid: ">=3.3.18"
