services:
  verification:
    build:
      context: .
      dockerfile: Dockerfile.verification
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      VERIFICATION_HOST: "0.0.0.0"
      VERIFICATION_CORS_ORIGIN: "${VERIFICATION_CORS_ORIGIN:-*}"
      VERIFICATION_BRAND_NAME: "${VERIFICATION_BRAND_NAME:-Aethon Beacon}"
      LOCAL_VERIFICATION_DEBUG: "${LOCAL_VERIFICATION_DEBUG:-0}"
      VERIFICATION_CODE_TTL_MS: "${VERIFICATION_CODE_TTL_MS:-600000}"
      VERIFICATION_MAX_REQUESTS_PER_WINDOW: "${VERIFICATION_MAX_REQUESTS_PER_WINDOW:-5}"
      VERIFICATION_REQUEST_WINDOW_MS: "${VERIFICATION_REQUEST_WINDOW_MS:-900000}"
      VERIFICATION_MAX_CONFIRM_ATTEMPTS: "${VERIFICATION_MAX_CONFIRM_ATTEMPTS:-5}"
      VERIFICATION_SMS_WEBHOOK_URL: "${VERIFICATION_SMS_WEBHOOK_URL:-}"
      VERIFICATION_EMAIL_WEBHOOK_URL: "${VERIFICATION_EMAIL_WEBHOOK_URL:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      TWILIO_MESSAGING_SERVICE_SID: "${TWILIO_MESSAGING_SERVICE_SID:-}"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      SENDGRID_FROM_EMAIL: "${SENDGRID_FROM_EMAIL:-}"
      SENDGRID_FROM_NAME: "${SENDGRID_FROM_NAME:-Aethon Beacon}"
