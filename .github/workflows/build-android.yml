name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# A batch push of several commits used to spawn one Android build per commit,
# all racing to publish to the same Play tracks. Serialise them so a newer
# push cancels any still-running/queued build and only the latest commit
# publishes -- fewer wasted runner minutes and no overlapping Play uploads.
concurrency:
  group: android-play
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Expo inlines EXPO_PUBLIC_* vars into the JS bundle at build time (not
      # runtime), so it has to be present here, not just in deploy_aethon.command
      # (web) and eas.json (unused EAS profiles). Without it, the app silently
      # falls back to a fake local OTP code and disables every Gemini-powered
      # card on every Android build this workflow produces -- which is exactly
      # what testers have been running.
      EXPO_PUBLIC_VERIFICATION_API_BASE_URL: "https://aethon-beacon-verification.onrender.com"
      # Community feed/chat realtime sync. The anon/publishable key is meant
      # to be public (Supabase's own design -- access is controlled by RLS
      # policies on the aethon_community_messages table, not by hiding this
      # key), so it's safe to bake into CI the same way as the verification
      # URL above.
      EXPO_PUBLIC_SUPABASE_URL: "https://isfkxmrathirqkrwfagg.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_x2hdByZdsmU26qPDuy5pZA_1PztSSwv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the build on the app's own checks so a broken commit can never reach
      # Play testers. Typecheck + the regression suites are fast and catch
      # regressions in the counselling, vedic, tone, visibility and product
      # quality engines before a binary is ever built.
      - name: Verify (typecheck + regression tests)
        run: |
          pnpm run typecheck
          pnpm run test:tone
          pnpm run test:vedic
          pnpm run test:visibility
          pnpm run test:product-quality
          pnpm run test:upgrades

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Write release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          # android/app/build.gradle throws a hard error for the release build
          # type unless keystore.properties exists (it's gitignored on purpose,
          # so CI has to materialize it from secrets, same pattern as the iOS
          # ASC key).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-release.jks
          cat > keystore.properties <<EOF
          storeFile=upload-release.jks
          storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}
          keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}
          keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}
          EOF
          if ! keytool -list -keystore app/upload-release.jks -storepass "$ANDROID_KEYSTORE_STORE_PASSWORD" >/dev/null 2>/tmp/keytool_err.txt; then
            echo "::error::Decoded keystore failed validation: $(cat /tmp/keytool_err.txt | tr '\n' ' '). Re-check the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_STORE_PASSWORD secrets."
            exit 1
          fi
          echo "Release keystore written and validated."

      - name: Set unique Android versionCode
        working-directory: android
        run: |
          # Play Console permanently rejects any versionCode it has seen
          # before, even from a failed/draft upload -- it does not have to
          # succeed for the number to be "used up." Manually bumping the
          # number in build.gradle by hand does not scale: every commit that
          # doesn't happen to bump it (which is most commits -- versionCode
          # has nothing to do with app code changes) collides with whatever
          # the last successful publish used, and the whole CI run fails at
          # the very last step after ~13 minutes of building.
          #
          # github.run_number is a GitHub-guaranteed, monotonically
          # increasing integer, unique per workflow file, that only ever
          # goes up. Using it directly as the versionCode means every run
          # -- whether or not the app code changed -- gets a versionCode
          # strictly greater than every prior run, so collisions between
          # two CI runs are structurally impossible.
          #
          # That guarantee does NOT cover versionCodes consumed OUTSIDE this
          # workflow -- e.g. manual troubleshooting in the Play Console UI
          # (draft releases, "add from library") can burn a whole range of
          # version codes without a single CI run ever using them. That's
          # exactly what happened on 2026-08-06: runs #214, #215, and #216
          # all failed on "Version code N has already been used" even though
          # each was the first CI run to ever try that number, because a
          # manual Play Console session earlier the same day had already
          # burned that range. A +100000 offset jumps past any such
          # manually-burned range (past or future) while staying trivially
          # far below Android's hard versionCode ceiling of ~2.1 billion, and
          # remains monotonically increasing forever since run_number is.
          # The human-readable app.json/build.gradle value stays as a
          # cosmetic baseline; this step overwrites it for the actual build.
          NEW_VERSION_CODE=$(( ${{ github.run_number }} + 100000 ))
          echo "Setting versionCode to $NEW_VERSION_CODE (GitHub run number)"
          sed -i -E "s/versionCode [0-9]+/versionCode ${NEW_VERSION_CODE}/" app/build.gradle
          grep -n "versionCode" app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"

      - name: Build release AAB (App Bundle for Play Console)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethon-beacon-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethon-beacon-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Validate Google Play service account JSON
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"].strip()

          if not raw:
              print("ERROR: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty.", file=sys.stderr)
              sys.exit(1)

          # A correctly pasted service-account JSON file is already valid
          # JSON -- its private_key field contains proper "\n" escape
          # sequences, which must NOT be turned into real newlines before
          # parsing (that would break the JSON syntax). Try parsing the
          # raw value first, and only fall back to normalizing common
          # paste mistakes (wrapping quotes, double-escaped backslashes)
          # if the raw value doesn't parse on its own.
          candidates = [raw]

          stripped = raw.strip('"').strip("'")
          if stripped != raw:
              candidates.append(stripped)

          normalized = stripped.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\r")
          if normalized != stripped:
              candidates.append(normalized)

          data = None
          last_exc = None
          for candidate in candidates:
              if not candidate:
                  continue
              try:
                  data = json.loads(candidate)
                  break
              except Exception as exc:
                  last_exc = exc

          if data is None:
              print("ERROR: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON.", file=sys.stderr)
              print(f"Detail: {last_exc}", file=sys.stderr)
              sys.exit(1)

          required = {"type", "project_id", "private_key_id", "private_key", "client_email"}
          missing = sorted(required.difference(data))
          if missing:
              print("ERROR: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing required fields:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          if "-----BEGIN PRIVATE KEY-----" not in data["private_key"]:
              print("ERROR: service account private_key does not look like a PEM private key.", file=sys.stderr)
              sys.exit(1)

          print("Google Play service account JSON looks valid.")
          PY

      # ── Play Console publish (only runs if GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is set) ──
      # Add the secret in: GitHub → Settings → Secrets and variables → Actions.
      # Uses r0adkll/upload-google-play to submit the AAB.
      #
      # Google Play's "Internal testing" and "Closed testing (Alpha)" are two
      # separate, unlinked tracks -- publishing to one never reaches testers
      # on the other. The real closed-testing tester lists (the ones synced
      # by the android-tester-auto-sync scheduled task) live on the alpha
      # track, so both need the same release.
      #
      # 2026-08-06 incident: this used to be two separate steps, each with
      # its own `track:` (singular) input and both uploading the exact same
      # AAB/versionCode. The first step (internal) succeeded and consumed
      # the versionCode; the second step (alpha) then failed every single
      # run with "Version code N has already been used" -- Play Console
      # version codes are unique per app package, not per track, so the same
      # number can never be uploaded twice even to a different track. The
      # fix is the `tracks` (plural) input added in upload-google-play
      # v1.1.4+, which assigns one uploaded release to multiple
      # comma-separated tracks in a single API call/upload, so the
      # versionCode is only ever consumed once.
      - name: Publish to Play Console (internal + alpha tracks)
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aethonbeacon.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
