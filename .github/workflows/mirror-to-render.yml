name: Build web + deploy to Render

# Render's "aethon-beacon-web" service serves a pre-built dist/ folder from
# a SEPARATE GitHub repo (trikuta9081/AETHON-beacon-, watching its "main"
# branch) rather than building from source itself (see Dockerfile.web --
# "Serve pre-built dist committed to repo (no build step -- instant
# deploys)"). Historically that meant a human had to remember to rebuild
# the web bundle locally and push it to that second repo by hand -- the
# exact kind of step that gets skipped and causes "I shipped it but the
# site didn't update."
#
# This workflow removes that step entirely. On every push to master here,
# it builds the web bundle itself and pushes the result to
# AETHON-beacon-/main, which Render is watching and will redeploy within
# seconds. Combined with build-android.yml and build-ios.yml (which also
# trigger on push to master), a single `git push origin master` now ships
# to all three surfaces -- web, Android testers, iOS testers -- with
# nothing left to do by hand.
#
# One-time setup required: create a GitHub Personal Access Token that can
# push to trikuta9081/AETHON-beacon-, then add it as a repository secret
# here named RENDER_MIRROR_TOKEN (Settings -> Secrets and variables ->
# Actions -> New repository secret). A fine-grained token scoped to just
# that one repo with "Contents: Read and write" permission is enough --
# it never touches this repo or any other.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone). Pushing HEAD to
          # the separate AETHON-beacon- repo builds a pack that references parent
          # commits; with a shallow clone those objects are missing and the remote
          # rejects the push with "did not receive expected object / index-pack
          # failed". Fetching full history makes the pack complete.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the web deploy on the app's own checks so a broken commit can never
      # reach the live site.
      - name: Verify (typecheck + regression tests)
        run: |
          pnpm run typecheck
          pnpm run test:tone
          pnpm run test:vedic
          pnpm run test:visibility
          pnpm run test:product-quality
          pnpm run test:upgrades

      - name: Build web bundle
        run: pnpm run export:web
        env:
          EXPO_PUBLIC_VERIFICATION_API_BASE_URL: "https://aethon-beacon-verification.onrender.com"
          EXPO_PUBLIC_SUPABASE_URL: "https://isfkxmrathirqkrwfagg.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_x2hdByZdsmU26qPDuy5pZA_1PztSSwv"

      - name: Commit bundle and push to the Render-watched repo
        env:
          RENDER_MIRROR_TOKEN: ${{ secrets.RENDER_MIRROR_TOKEN }}
        run: |
          if [ -z "$RENDER_MIRROR_TOKEN" ]; then
            echo "::error::RENDER_MIRROR_TOKEN secret is not set -- see the comment at the top of this workflow for one-time setup."
            exit 1
          fi
          # Strip any accidental leading/trailing whitespace or newline that can get
          # baked into the secret when copy-pasting a token from the browser -- a
          # trailing \n embedded in the URL below is exactly the kind of thing that
          # produces a "repository not found" error even with a correctly-scoped token.
          CLEAN_TOKEN="$(printf '%s' "$RENDER_MIRROR_TOKEN" | tr -d '[:space:]')"
          echo "Token length after trim: ${#CLEAN_TOKEN} chars (sanity check only, value never printed)"

          # DIAGNOSTIC: ask the GitHub API directly whether this token can see the
          # target repo. This is independent of git's auth format, so it isolates
          # "is the token/scope wrong" from "is the git URL format wrong".
          #   200 -> token CAN see the repo (any push failure is a git-format issue)
          #   404 -> token cannot see the repo (scope/approval problem on the token)
          #   401 -> token is invalid/expired
          API_STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/trikuta9081/AETHON-beacon-)"
          echo "GitHub API repo-access check returned HTTP ${API_STATUS}"

          # actions/checkout installs a global git auth header
          #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
          # containing the workflow's built-in GITHUB_TOKEN. That header is sent on
          # EVERY push to github.com, overriding the credentials embedded in the
          # remote URL below. The built-in token can only access THIS repo
          # (aethonbeacon), so pushing to the separate AETHON-beacon- repo was
          # being rejected as a misleading "Repository not found". Clearing the
          # inherited header lets our own RENDER_MIRROR_TOKEN in the URL be used.
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # Publish the mirror as a single self-contained snapshot on an orphan
          # branch (no parent history -> the pushed pack can never be missing a
          # parent object, independent of clone depth). We also drop
          # .github/workflows because GitHub refuses to let a fine-grained PAT
          # without "workflow" scope create/update workflow files in the target
          # repo -- and the Render mirror (which only serves the pre-built dist/
          # via Dockerfile.web) has no need for aethonbeacon's CI workflows.
          git checkout --orphan render-deploy
          rm -rf .github/workflows
          git add -A
          git add -f dist
          git -c user.name="aethon-deploy-bot" \
              -c user.email="actions@users.noreply.github.com" \
              commit -m "chore(web): auto-build from ${GITHUB_SHA}"

          git remote add render-mirror "https://x-access-token:${CLEAN_TOKEN}@github.com/trikuta9081/AETHON-beacon-.git"
          git push render-mirror render-deploy:main --force

      - name: Smoke check live Render deploy
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short HEAD)"
          live_url="https://aethon-beacon-web.onrender.com"

          echo "Waiting for live Render bundle to include commit ${short_sha}"
          for attempt in $(seq 1 120); do
            html="$(curl -fsSL "${live_url}" || true)"
            bundle_path="$(printf '%s' "${html}" | sed -n 's/.*src="\([^"]*AppEntry-[^"]*\.js\)".*/\1/p' | head -n 1)"

            if [ -n "${bundle_path}" ]; then
              bundle_url="${live_url}${bundle_path}"
              if curl -fsSL "${bundle_url}" | grep -Fq "${short_sha}"; then
                if printf '%s' "${html}" | grep -Fq '<title>Aethon Beacon</title>'; then
                  echo "Live Render smoke check passed for ${short_sha}"
                  exit 0
                fi
              fi
            fi

            sleep 10
          done

          echo "::error::Live Render smoke check failed for ${short_sha}"
          exit 1
