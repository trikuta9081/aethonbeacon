name: Build iOS → TestFlight (App Store Connect API)

# Builds a signed iOS .ipa on a macOS runner and uploads to TestFlight,
# using ONLY an App Store Connect API key — no Apple ID / 2FA / password
# needed at runtime, no .p12 certificate export, no manual provisioning
# profile management.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_ID     = 4Y6H9428FJ
#   APPSTORE_API_ISSUER_ID  = 987583dc-d087-45b3-ad8a-550f59621e8d
#   APPSTORE_API_KEY_P8     = full contents of the AuthKey_<KEYID>.p8 file

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APPLE_TEAM_ID: '846YFF8Z98'
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.15.2

      - name: Install pods
        working-directory: ios
        run: pod install --repo-update

      - name: Write App Store Connect API key file (normalize to PEM)
        run: |
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_API_KEY_P8:-}" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            # Diagnostics that don't leak the secret itself: length + whether
            # it looks like it already has a PEM header. Helps tell "secret is
            # empty/truncated" apart from "secret needs normalization".
            echo "APPSTORE_API_KEY_P8 length: ${#APPSTORE_API_KEY_P8} chars"
            case "$APPSTORE_API_KEY_P8" in
              *BEGIN*PRIVATE\ KEY*) echo "Contains a BEGIN PRIVATE KEY header: yes" ;;
              *) echo "Contains a BEGIN PRIVATE KEY header: no" ;;
            esac
            # Normalize the pasted secret to a valid PEM regardless of
            # whether the user pasted (a) proper PEM with newlines,
            # (b) all-on-one-line PEM (GitHub textarea can strip newlines),
            # (c) escaped newline sequences, or
            # (d) just the bare base64 body without BEGIN/END lines.
            if ! python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_asc_key.py" > "$KEY_PATH" 2>/tmp/normalize_err.txt; then
              echo "::error::normalize_asc_key.py failed: $(cat /tmp/normalize_err.txt)"
              exit 1
            fi
            chmod 600 "$KEY_PATH"
            if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>/tmp/openssl_err.txt; then
              echo "::error::Normalized App Store Connect key is not a valid PEM document: $(cat /tmp/openssl_err.txt | tr '\n' ' '). Re-check the APPSTORE_API_KEY_P8 secret."
              exit 1
            fi
            echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "HAS_ASC_KEY=true" >> "$GITHUB_ENV"
            echo "API key written to $KEY_PATH"
            echo "First line of key (should be -----BEGIN PRIVATE KEY-----):"
            head -1 "$KEY_PATH"
            echo "Last line of key (should be -----END PRIVATE KEY-----):"
            tail -1 "$KEY_PATH"
            echo "Line count (should be > 2):"
            wc -l "$KEY_PATH"
          else
            echo "APPSTORE_API_KEY_ID or APPSTORE_API_KEY_P8 not set — skipping ASC key write"
            echo "HAS_ASC_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Archive iOS
        working-directory: ios
        run: |
          if [ "${HAS_ASC_KEY:-false}" = "true" ]; then
            xcodebuild \
              -workspace AethonBeacon.xcworkspace \
              -scheme AethonBeacon \
              -configuration Release \
              -archivePath "$PWD/build/AethonBeacon.xcarchive" \
              -destination "generic/platform=iOS" \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
              -authenticationKeyPath "$APPSTORE_KEY_PATH" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive
          else
            xcodebuild \
              -workspace AethonBeacon.xcworkspace \
              -scheme AethonBeacon \
              -configuration Release \
              -archivePath "$PWD/build/AethonBeacon.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive
          fi

      - name: Export .ipa
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          if [ "${HAS_ASC_KEY:-false}" = "true" ]; then
            xcodebuild \
              -exportArchive \
              -archivePath "$PWD/build/AethonBeacon.xcarchive" \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath "$PWD/build" \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
              -authenticationKeyPath "$APPSTORE_KEY_PATH"
          else
            xcodebuild \
              -exportArchive \
              -archivePath "$PWD/build/AethonBeacon.xcarchive" \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath "$PWD/build"
          fi

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-ipa
          path: ios/build/*.ipa
          retention-days: 14

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-xcarchive
          path: ios/build/AethonBeacon.xcarchive
          retention-days: 7

      - name: Upload to TestFlight
        run: |
          if [ "${HAS_ASC_KEY:-false}" = "true" ]; then
            IPA=$(ls ios/build/*.ipa 2>/dev/null | head -1)
            if [ -z "$IPA" ]; then
              echo "No .ipa found in ios/build/ — skipping upload"
              exit 0
            fi
            echo "Uploading $IPA to TestFlight via App Store Connect API..."
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$APPSTORE_API_KEY_ID" \
              --apiIssuer "$APPSTORE_API_ISSUER_ID" \
              --verbose
          else
            echo "ASC API key not configured — skipping TestFlight upload."
            echo "Download the .ipa artifact and use Transporter for manual upload."
          fi
