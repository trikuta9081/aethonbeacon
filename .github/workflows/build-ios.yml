name: Build iOS → TestFlight (App Store Connect API)

# Builds a signed iOS .ipa on a macOS runner and uploads to TestFlight.
#
# Signing: this workflow imports ONE fixed, already-existing Apple
# Distribution certificate + provisioning profile on every run, instead of
# asking Xcode to auto-create a new certificate each time
# (-allowProvisioningUpdates). That auto-create-per-run approach is what
# exhausted the Apple Developer account's certificate quota after enough CI
# runs ("Choose a certificate to revoke. Your account has reached the
# maximum number of certificates.") -- every run failed identically from
# that point on, since Apple refused to issue yet another certificate.
# Reusing one certificate can never hit that ceiling again.
#
# The App Store Connect API key is still used, but only for the final
# TestFlight upload step (altool), which doesn't consume certificate quota.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_ID        = 4Y6H9428FJ
#   APPSTORE_API_ISSUER_ID     = 987583dc-d087-45b3-ad8a-550f59621e8d
#   APPSTORE_API_KEY_P8        = full contents of the AuthKey_<KEYID>.p8 file
#   IOS_DIST_CERT_P12_BASE64   = `base64 -i YourCert.p12 | pbcopy` output of an
#                                EXISTING Apple Distribution certificate + key
#                                exported from Keychain Access on a Mac that
#                                has already signed a build for this app --
#                                do NOT create a brand-new certificate, the
#                                account is at its limit.
#   IOS_DIST_CERT_PASSWORD     = the password you set during that .p12 export
#   IOS_PROVISIONING_PROFILE_BASE64 = `base64 -i YourProfile.mobileprovision | pbcopy`
#                                output of an "App Store" distribution
#                                provisioning profile for com.aethonbeacon.app,
#                                built against that same certificate
#                                (developer.apple.com → Profiles). Profiles
#                                are a separate, much less restrictive quota
#                                from certificates, so creating a fresh one
#                                is fine even while the certificate quota is
#                                maxed out.
#
# If the three IOS_* secrets above are missing or point to the wrong app, this
# workflow fails early. Do not fall back to Xcode automatic signing here: that
# path can create new certificates and has already exhausted the Apple account
# certificate quota.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pushing several commits at once used to spawn one iOS build per commit, all
# racing on the same TestFlight version. This serialises them: a newer push
# cancels any still-running/queued iOS build so only the latest commit ships,
# which also eliminates same-minute build-number collisions and saves the
# scarce/slow macOS runner minutes.
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APPLE_TEAM_ID: '846YFF8Z98'
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      # Same reasoning as build-android.yml: Expo inlines EXPO_PUBLIC_* at JS
      # bundle time, so without this here the TestFlight build ships with fake
      # local OTP and disabled connected guidance cards too.
      EXPO_PUBLIC_VERIFICATION_API_BASE_URL: "https://aethon-beacon-verification.onrender.com"
      # Community feed/chat realtime sync -- see build-android.yml for why the
      # anon/publishable key is safe to hardcode here (RLS-protected, not a
      # secret key).
      EXPO_PUBLIC_SUPABASE_URL: "https://isfkxmrathirqkrwfagg.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_x2hdByZdsmU26qPDuy5pZA_1PztSSwv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Gate the build on the app's own checks so a broken commit can never reach
      # TestFlight. Fast, and catches engine regressions before the long native
      # archive/upload runs.
      - name: Verify (typecheck + regression tests)
        run: |
          pnpm run typecheck
          pnpm run test:tone
          pnpm run test:vedic
          pnpm run test:visibility
          pnpm run test:product-quality
          pnpm run test:upgrades

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.15.2

      - name: Install pods
        working-directory: ios
        run: pod install --repo-update

      - name: Set unique iOS build number
        working-directory: ios
        run: |
          # App Store Connect permanently rejects any CFBundleVersion it has
          # already seen for this app -- even from a build that later got
          # superseded -- so a hand-bumped, static CURRENT_PROJECT_VERSION in
          # the checked-in project.pbxproj works exactly once. Every commit
          # after that bump (which is most commits -- this number has nothing
          # to do with app code changes) reuses the same value and the whole
          # 30-40 minute CI run fails at the very last step with
          # "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" on cfBundleVersion.
          #
          # Use a UTC timestamp instead of github.run_number. The app already
          # has build 148 in App Store Connect while this workflow's run
          # number is lower, so run_number alone can be rejected as a
          # duplicate/older CFBundleVersion. A timestamp is numeric, increases
          # with every later run, and is safely above all historical builds.
          #
          # SECOND precision (YYMMDDHHMMSS), not minute (YYMMDDHHMM): a single
          # push of several commits triggers several iOS builds at once, and
          # with only minute precision two builds that hit this step in the
          # same minute produced the SAME CFBundleVersion -- App Store Connect
          # accepts the first upload and rejects the rest with
          # "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" on cfBundleVersion
          # (exactly the 2026-08-07 batch that failed three iOS runs in a row).
          # 12 digits is still numerically far above the old 10-digit
          # minute-precision builds already in App Store Connect, so it stays
          # monotonic. The concurrency guard at the top of this file also now
          # cancels superseded builds so a batch push only ships its latest
          # commit -- the two fixes together make same-version collisions
          # structurally impossible.
          NEW_BUILD_NUMBER="$(date -u +%y%m%d%H%M%S)"
          echo "Setting iOS build number to $NEW_BUILD_NUMBER (UTC timestamp)"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${NEW_BUILD_NUMBER};/" AethonBeacon.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NEW_BUILD_NUMBER}" AethonBeacon/Info.plist
          grep -n "CURRENT_PROJECT_VERSION" AethonBeacon.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" AethonBeacon/Info.plist

      - name: Write App Store Connect API key file (normalize to PEM)
        run: |
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_API_KEY_P8:-}" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            # Diagnostics that don't leak the secret itself: length + whether
            # it looks like it already has a PEM header. Helps tell "secret is
            # empty/truncated" apart from "secret needs normalization".
            echo "APPSTORE_API_KEY_P8 length: ${#APPSTORE_API_KEY_P8} chars"
            case "$APPSTORE_API_KEY_P8" in
              *BEGIN*PRIVATE\ KEY*) echo "Contains a BEGIN PRIVATE KEY header: yes" ;;
              *) echo "Contains a BEGIN PRIVATE KEY header: no" ;;
            esac
            # Normalize the pasted secret to a valid PEM regardless of
            # whether the user pasted (a) proper PEM with newlines,
            # (b) all-on-one-line PEM (GitHub textarea can strip newlines),
            # (c) escaped newline sequences, or
            # (d) just the bare base64 body without BEGIN/END lines.
            if ! python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_asc_key.py" > "$KEY_PATH" 2>/tmp/normalize_err.txt; then
              echo "::error::normalize_asc_key.py failed: $(cat /tmp/normalize_err.txt)"
              exit 1
            fi
            chmod 600 "$KEY_PATH"
            if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>/tmp/openssl_err.txt; then
              echo "::error::Normalized App Store Connect key is not a valid PEM document: $(cat /tmp/openssl_err.txt | tr '\n' ' '). Re-check the APPSTORE_API_KEY_P8 secret."
              exit 1
            fi
            echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "HAS_ASC_KEY=true" >> "$GITHUB_ENV"
            echo "API key written to $KEY_PATH"
            echo "First line of key (should be -----BEGIN PRIVATE KEY-----):"
            head -1 "$KEY_PATH"
            echo "Last line of key (should be -----END PRIVATE KEY-----):"
            tail -1 "$KEY_PATH"
            echo "Line count (should be > 2):"
            wc -l "$KEY_PATH"
          else
            echo "APPSTORE_API_KEY_ID or APPSTORE_API_KEY_P8 not set — skipping ASC key write"
            echo "HAS_ASC_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate (reuse existing, never mint a new one)
        if: env.IOS_DIST_CERT_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>/tmp/import_err.txt; then
            echo "::error::Failed to import IOS_DIST_CERT_P12_BASE64 into keychain: $(cat /tmp/import_err.txt | tr '\n' ' '). Re-check the .p12 contents/password secrets."
            exit 1
          fi

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Apple Distribution\|iPhone Distribution" || true)
          echo "Signing identities found in imported keychain: $IDENTITY_COUNT"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          if [ "$IDENTITY_COUNT" = "0" ]; then
            echo "::error::No Apple Distribution / iPhone Distribution identity found in the imported .p12. Export the correct certificate (with its private key) from Keychain Access."
            exit 1
          fi

          echo "HAS_MANUAL_CERT=true" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        if: env.IOS_DIST_CERT_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          if ! security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist" 2>/tmp/profile_err.txt; then
            echo "::error::Couldn't read IOS_PROVISIONING_PROFILE_BASE64 as a provisioning profile: $(cat /tmp/profile_err.txt | tr '\n' ' ')."
            exit 1
          fi

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo "unknown")

          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Profile application identifier: $PROFILE_APP_ID"
          case "$PROFILE_APP_ID" in
            *com.aethonbeacon.app)
              # Correct explicit App ID profile -- keep the manual-signing path
              # and sign with this profile by name.
              echo "Profile matches com.aethonbeacon.app -- using manual signing with it."
              echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Provisioning profile application-identifier ('$PROFILE_APP_ID') is not com.aethonbeacon.app. Replace IOS_PROVISIONING_PROFILE_BASE64 with an explicit App Store profile for 846YFF8Z98.com.aethonbeacon.app that uses the imported distribution certificate."
              exit 1
              ;;
          esac

      - name: Warm up CocoaPods Swift modules (clean-checkout race workaround)
        working-directory: ios
        run: |
          # On a completely clean checkout (no DerivedData), Xcode has been
          # observed to start compiling AppDelegate.swift before the "Expo"
          # pod's own Swift module has finished building under static
          # framework linkage, failing with "No such module 'Expo'". A single
          # unsigned `build` pass beforehand forces all pod targets to build
          # in dependency order and populates the module cache, so the real
          # archive step below reuses it instead of racing. Not fatal if it
          # fails — the archive step is the one that actually matters.
          set +e
          xcodebuild \
            -workspace AethonBeacon.xcworkspace \
            -scheme AethonBeacon \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            build 2>&1 | tee warmup-build.log | tail -100
          echo "Warmup build exit status: ${PIPESTATUS[0]}"
          set -e

      - name: Archive iOS
        working-directory: ios
        run: |
          if [ "${HAS_MANUAL_CERT:-false}" = "true" ] && [ -n "${PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            # Sign with the one imported, reused certificate --
            # never asks Apple for a new one, so it can't hit the certificate
            # quota that broke every build from run #97 onward.
            xcodebuild \
              -workspace AethonBeacon.xcworkspace \
              -scheme AethonBeacon \
              -configuration Release \
              -archivePath "$PWD/build/AethonBeacon.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              "PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_SPECIFIER" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive 2>&1 | tee archive.log | tail -300
            ARCHIVE_STATUS=${PIPESTATUS[0]}
          else
            echo "::error::Manual iOS signing is not fully configured. IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64 must all be valid before archiving."
            exit 1
          fi
          if [ "$ARCHIVE_STATUS" != "0" ]; then
            echo "::error::Archive failed (exit $ARCHIVE_STATUS). Last 300 lines shown above; full log in archive.log artifact."
            exit "$ARCHIVE_STATUS"
          fi

      - name: Upload archive log (always, for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-archive-log
          path: |
            ios/warmup-build.log
            ios/archive.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Export .ipa
        working-directory: ios
        run: |
          if [ "${HAS_MANUAL_CERT:-false}" = "true" ] && [ -n "${PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.aethonbeacon.app</key>
              <string>${PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
          </dict>
          </plist>
          EOF
          else
            echo "::error::Cannot export IPA because manual signing profile was not installed."
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/AethonBeacon.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-ipa
          path: ios/build/*.ipa
          retention-days: 14

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-xcarchive
          path: ios/build/AethonBeacon.xcarchive
          retention-days: 7

      - name: Upload to TestFlight
        run: |
          if [ "${HAS_ASC_KEY:-false}" != "true" ]; then
            echo "::error::ASC API key is required for automatic TestFlight upload."
            exit 1
          fi
          IPA=$(ls ios/build/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found in ios/build; TestFlight upload cannot proceed."
            exit 1
          fi
          echo "Uploading $IPA to TestFlight via App Store Connect API..."
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" \
            --verbose
