name: Build iOS → TestFlight (App Store Connect API)

# Builds a signed iOS .ipa on a macOS runner and uploads to TestFlight,
# using ONLY an App Store Connect API key — no Apple ID / 2FA / password
# needed at runtime, no .p12 certificate export, no manual provisioning
# profile management. Xcode auto-manages signing at build time.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_ID     = 4Y6H9428FJ
#   APPSTORE_API_ISSUER_ID  = 987583dc-d087-45b3-ad8a-550f59621e8d
#   APPSTORE_API_KEY_P8     = full contents of the AuthKey_<KEYID>.p8 file
#
# If any of those three secrets is missing, the workflow still builds the
# .ipa and uploads it as a GitHub Actions artifact — just no TestFlight push.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APPLE_TEAM_ID: '846YFF8Z98'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.15.2

      - name: Install pods
        working-directory: ios
        run: pod install --repo-update

      - name: Write App Store Connect API key file (if provided)
        if: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "API key written to $KEY_PATH"

      - name: Archive iOS (Xcode auto-manages signing via ASC API key)
        working-directory: ios
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          # When the ASC API key is present, use -allowProvisioningUpdates so
          # Xcode can create/fetch signing certificates and provisioning
          # profiles on the fly. Otherwise fall back to Automatic signing (which
          # still works for archiving but may fail if the runner has no local
          # signing assets).
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_API_ISSUER_ID:-}" ] && [ -f "$APPSTORE_KEY_PATH" ]; then
            xcodebuild \
              -workspace AethonBeacon.xcworkspace \
              -scheme AethonBeacon \
              -configuration Release \
              -archivePath $PWD/build/AethonBeacon.xcarchive \
              -destination "generic/platform=iOS" \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
              -authenticationKeyPath "$APPSTORE_KEY_PATH" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive
          else
            xcodebuild \
              -workspace AethonBeacon.xcworkspace \
              -scheme AethonBeacon \
              -configuration Release \
              -archivePath $PWD/build/AethonBeacon.xcarchive \
              -destination "generic/platform=iOS" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive
          fi

      - name: Export .ipa
        working-directory: ios
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_API_ISSUER_ID:-}" ] && [ -f "$APPSTORE_KEY_PATH" ]; then
            xcodebuild \
              -exportArchive \
              -archivePath $PWD/build/AethonBeacon.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath $PWD/build \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
              -authenticationKeyPath "$APPSTORE_KEY_PATH"
          else
            xcodebuild \
              -exportArchive \
              -archivePath $PWD/build/AethonBeacon.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath $PWD/build
          fi

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-ipa
          path: ios/build/*.ipa
          retention-days: 14

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: AethonBeacon-ios-xcarchive
          path: ios/build/AethonBeacon.xcarchive
          retention-days: 7

      # ── TestFlight upload via App Store Connect API ──
      # Only runs if all three ASC secrets are present.
      - name: Upload to TestFlight
        if: ${{ secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPSTORE_API_KEY_P8 != '' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(ls ios/build/*.ipa | head -1)
          echo "Uploading $IPA to TestFlight via ASC API..."
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" \
            --verbose
