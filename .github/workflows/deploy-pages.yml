name: Deploy NAYIQ web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and release artifacts
        run: |
          pnpm run release:check
          pnpm run typecheck
          pnpm run test:visibility
          pnpm run test:product-quality
          pnpm run test:upgrades

      - name: Build static web bundle
        run: pnpm run export:web
        env:
          EXPO_PUBLIC_VERIFICATION_API_BASE_URL: "https://aethon-beacon-verification.onrender.com"
          EXPO_PUBLIC_SUPABASE_URL: "https://isfkxmrathirqkrwfagg.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_x2hdByZdsmU26qPDuy5pZA_1PztSSwv"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
